[project]
name = "rag-ia"
version = "0.1.0"
description = "RAG (Retrieval-Augmented Generation) avec LLM local via Ollama"
authors = [
    {name = "Tunderalpha", email = "131662618+AlexisGauthron@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    # PyTorch - version standard compatible tous OS (CPU + CUDA auto-detect + MPS pour Mac)
    "torch >=2.2.0,<3.0.0",
    "torchvision >=0.17.0,<1.0.0",
    "torchaudio >=2.2.0,<3.0.0",

    # Transformers et embeddings
    "sentence-transformers >=2.2.0,<4.0.0",
    "transformers >=4.36.0,<5.0.0",
    "accelerate >=0.25.0,<2.0.0",
    "sentencepiece >=0.1.99,<0.3.0",

    # LangChain ecosystem
    "langchain >=0.1.0,<0.4.0",
    "langchain-community >=0.0.10,<0.4.0",
    "langchain-huggingface >=0.0.1,<0.4.0",
    "langchain-ollama >=0.1.0,<0.4.0",
    "langchain-chroma >=0.1.0,<0.3.0",
    "lark >=1.1.0,<2.0.0",

    # Vector database
    "chromadb >=0.4.0,<2.0.0",
    "faiss-cpu >=1.7.0,<2.0.0",

    # Document processing
    "pypdf >=3.0.0,<7.0.0",
    "unstructured >=0.10.0,<0.19.0",
    "markdown >=3.4,<4.0",

    # Utilities
    "numpy >=1.24.0,<3.0.0",
    "streamlit >=1.28.0,<2.0.0",
]

[project.optional-dependencies]
# Pour les utilisateurs avec GPU NVIDIA (Linux/Windows uniquement)
cuda = [
    "bitsandbytes >=0.41.0,<0.49.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
